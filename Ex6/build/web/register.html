<html>
<head>
<title>Online Exam - Register</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #1e293b;
            height: 100vh;
            margin: 0;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .register-box {
            width: 350px;
            background-color: #ffffff;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            color: #f97316;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: #64748b;
            margin-bottom: 25px;
        }

        .input-box {
            margin-bottom: 15px;
        }

        label {
            display: block;
            color: #1e293b;
            font-weight: bold;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            box-sizing: border-box;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #f97316;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: #f97316;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background-color: #ea580c;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .login {
            text-align: center;
            margin-top: 20px;
            color: #64748b;
        }

        .login a {
            color: #f97316;
            text-decoration: none;
            font-weight: bold;
        }

        .login a:hover {
            text-decoration: underline;
        }

    </style>

</head>

<body>

    <div class="register-box">

        <h1>Online Exam</h1>

        <p class="subtitle">
            Create your account
        </p>


        <form onsubmit="register(event)">

            <div class="input-box">

                <label>Full Name</label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="input-box">

                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <div class="input-box">

                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Create a password"
                    minlength="6"
                    required
                >

            </div>


            <div class="input-box">

                <label>Confirm Password</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    minlength="6"
                    required
                >

            </div>


            <button type="submit">
                Register
            </button>

        </form>


        <p id="message"></p>


        <div class="login">

            Already have an account?

            <a href="login.html">
                Login
            </a>

        </div>

    </div>


    <script>

        function register(event) {

            event.preventDefault();

            let name =
                document.getElementById("name").value;

            let email =
                document.getElementById("email").value;

            let password =
                document.getElementById("password").value;

            let confirmPassword =
                document.getElementById("confirmPassword").value;

            let message =
                document.getElementById("message");


            if (password != confirmPassword) {

                message.innerHTML =
                    "Passwords do not match";

                message.style.color = "red";

                return;
            }


            localStorage.setItem("name", name);
            localStorage.setItem("email", email);
            localStorage.setItem("password", password);


            message.innerHTML =
                "Registration successful!";

            message.style.color = "green";


            setTimeout(function() {

                window.location.href = "login.html";

            }, 1000);

        }

    </script>

</body>
</html>
