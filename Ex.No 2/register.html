<html>
<head>
<title>Syed Elegance - Registration</title>
</head>
<body style="background-color: beige; margin: 20px;">
 <h1 style="color: darkred; text-align: center;">SYED ELEGANCE</h1>
 <h2 style="text-align: center;">Registration</h2>
 <hr style="border: 1px solid ; margin: 20px;">
<form >

<fieldset style="border: 1px solid ; padding: 20px; border-radius: 5px; max-width: 500px; margin: 0 auto;">
<legend><b>Create Your Account</b></legend>

<table cellpadding="8">

<tr>
<td><label>Full Name</label></td>
<td><input type="text" name="name" required></td>
</tr>

<tr>
<td><label>Email ID</label></td>
<td><input type="email" name="email" required></td>
</tr>

<tr>
<td><label>Mobile Number</label></td>
<td><input type="tel" name="mobile" maxlength="10" required></td>
</tr>

<tr>
<td><label>Password</label></td>
<td><input type="password" name="password" required></td>
</tr>

<tr>
<td><label>Confirm Password</label></td>
<td><input type="password" name="confirm" required></td>
</tr>

<tr>
<td><label>Gender</label></td>
<td>
<input type="radio" name="gender"> Male
<input type="radio" name="gender"> Female
<input type="radio" name="gender"> Other
</td>
</tr>

<tr>
<td><label>Date of Birth</label></td>
<td><input type="date" name="dob"></td>
</tr>

<tr>
<td><label>Address</label></td>
<td>
<textarea rows="4" cols="23"></textarea>
</td>
</tr>

<tr>
<td><label>State</label></td>
<td>
<select>
<option>Tamil Nadu</option>
<option>Kerala</option>
<option>Karnataka</option>
<option>Andhra Pradesh</option>
<option>Telangana</option>
</select>
</td>
</tr>

<tr>
<td><label>Languages Known</label></td>
<td>
<input type="checkbox"> Tamil
<input type="checkbox"> English
<input type="checkbox"> Hindi
</td>
</tr>

<tr>
<td>
<Button><a href="login.html" style="text-decoration: none;">Register</Button>
<input type="reset" value="Clear">
</td>
</tr>

</table>

</fieldset>

</form>

<br>
<div style="text-align: center; margin-top: 20px;">
<p>Already have an account? <a href="login.html" style="color: darkred; text-decoration: none; font-weight: bold;">Login Here</a></p>
</div>
<hr style="border: 1px solid #ccc; margin: 20px 0;">
<p style="text-align: center; color: #555;">

</p>
</body>
</html>
